# Gradle Daemon 与构建性能优化
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin 编译优化
kotlin.code.style=official

# Android Gradle Plugin
# android.useAndroidX / android.nonTransitiveRClass / android.nonFinalResIds
# 在 AGP 8+ 中均默认为 true，无需显式声明
